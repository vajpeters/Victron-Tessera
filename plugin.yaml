defaults:
  SOC: sensor.victron_vrm_unassigned_soc
  BATTERY: sensor.victron_vrm_unassigned_battery
  SOLAR: sensor.victron_vrm_unassigned_solar
  LOAD: sensor.victron_vrm_unassigned_load
  GRID: sensor.victron_vrm_unassigned_grid
  VOLTAGE: sensor.victron_vrm_unassigned_voltage
  CURRENT: sensor.victron_vrm_unassigned_current
  SOURCE_TIME: sensor.victron_vrm_unassigned_source_time
text_sensor:
- platform: homeassistant
  id: vrm_soc_value
  entity_id: ${SOC}
  internal: true
- platform: homeassistant
  id: vrm_soc_unit
  entity_id: ${SOC}
  attribute: unit_of_measurement
  internal: true
- platform: homeassistant
  id: vrm_battery_value
  entity_id: ${BATTERY}
  internal: true
- platform: homeassistant
  id: vrm_battery_unit
  entity_id: ${BATTERY}
  attribute: unit_of_measurement
  internal: true
- platform: homeassistant
  id: vrm_solar_value
  entity_id: ${SOLAR}
  internal: true
- platform: homeassistant
  id: vrm_solar_unit
  entity_id: ${SOLAR}
  attribute: unit_of_measurement
  internal: true
- platform: homeassistant
  id: vrm_load_value
  entity_id: ${LOAD}
  internal: true
- platform: homeassistant
  id: vrm_load_unit
  entity_id: ${LOAD}
  attribute: unit_of_measurement
  internal: true
- platform: homeassistant
  id: vrm_grid_value
  entity_id: ${GRID}
  internal: true
- platform: homeassistant
  id: vrm_grid_unit
  entity_id: ${GRID}
  attribute: unit_of_measurement
  internal: true
- platform: homeassistant
  id: vrm_voltage_value
  entity_id: ${VOLTAGE}
  internal: true
- platform: homeassistant
  id: vrm_voltage_unit
  entity_id: ${VOLTAGE}
  attribute: unit_of_measurement
  internal: true
- platform: homeassistant
  id: vrm_current_value
  entity_id: ${CURRENT}
  internal: true
- platform: homeassistant
  id: vrm_current_unit
  entity_id: ${CURRENT}
  attribute: unit_of_measurement
  internal: true
- platform: homeassistant
  id: vrm_source_time
  entity_id: ${SOURCE_TIME}
  internal: true
switch:
- platform: template
  id: vrm_battery_reverse
  name: VRM battery discharge positive
  optimistic: true
  restore_mode: RESTORE_DEFAULT_OFF
  entity_category: config
- platform: template
  id: vrm_grid_reverse
  name: VRM grid export positive
  optimistic: true
  restore_mode: RESTORE_DEFAULT_OFF
  entity_category: config
number:
- platform: template
  id: vrm_max_age
  name: VRM measurement maximum age
  optimistic: true
  min_value: 60
  max_value: 86400
  step: 60
  initial_value: 900
  restore_value: true
  unit_of_measurement: s
  entity_category: config
victron_vrm:
  soc: vrm_soc_value
  battery: vrm_battery_value
  solar: vrm_solar_value
  load: vrm_load_value
  grid: vrm_grid_value
  voltage: vrm_voltage_value
  current: vrm_current_value
  soc_unit: vrm_soc_unit
  battery_unit: vrm_battery_unit
  solar_unit: vrm_solar_unit
  load_unit: vrm_load_unit
  grid_unit: vrm_grid_unit
  voltage_unit: vrm_voltage_unit
  current_unit: vrm_current_unit
  source_time: vrm_source_time
  battery_reverse: vrm_battery_reverse
  grid_reverse: vrm_grid_reverse
  max_age: vrm_max_age
